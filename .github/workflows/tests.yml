name: Tests and retrieval evaluation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python demo.py
      - run: uv run --frozen python rag_demo.py
      - run: uv run --frozen python -m evals.run --check
